#下面这些内容是为了让MyBatis映射
#指定Mybatis的Mapper文件
mybatis.mapper-locations=classpath:mapper/*.xml
#指定Mybatis的实体目录
mybatis.type-aliases-package=com.example.demo.entity
#开启驼峰命名自动映射，即从经典数据库列名 A_COLUMN 到经典 Java 属性名 aColumn 的类似映射
mybatis.configuration.map-underscore-to-camel-case=true
# 应用服务 WEB 访问端口
server.port=9000

spring.datasource.url=jdbc:mysql://localhost:3306/demo?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456789
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Swagger配置
# 启用Swagger
springfox.documentation.enabled=true
# 启用Swagger UI
springfox.documentation.swagger-ui.enabled=true

# 解决Spring Boot 2.6.x与Springfox兼容性问题
spring.mvc.pathmatch.matching-strategy=ant_path_matcher